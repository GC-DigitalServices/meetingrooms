# Group configuration for the Room Booking Platform.
#
# Replace the placeholder UUIDs with real Entra ID group object IDs.
# Find them in: Azure portal → Entra ID → Groups → [group] → Object ID
#
# staff_groups: any user in at least one of these groups is treated as
#   "staff" and sees full booking detail for staff-organised meetings.
#
# admin_group: members of this group are platform admins — they can
#   book any room, pair/revoke iPads, view the audit log, and revoke
#   user sessions.

staff_groups:
  - "be1c4aa6-38e4-4232-bd61-955e63121fb1" # All Staff

admin_group: "6f0bf91a-5b22-4a64-9874-6754d2f0e18e" # MRBS Admin

# Email address that receives premises/transport notifications.
# Also requires PREMISES_SENDER_UPN env var (the sending mailbox).
premises_email: "premises@greenhead.ac.uk"

# Additional address copied only on MINIBUS booking notifications.
minibus_email: "OperationsCoordination@greenhead.ac.uk"

# Email address (or DL) that receives system alert emails:
# offline displays, subscription renewal failures, resync failures.
# Requires MAIL_SENDER_UPN env var.
admin_alert_email: "it@greenhead.ac.uk"
